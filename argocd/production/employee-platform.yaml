apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: employee-platform-production
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/diyanme/employee-platform-infrastructure.git
      targetRevision: main
      path: helm/employee-platform
      helm:
        valueFiles:
          - $values/apps/production/values.yaml
    - repoURL: https://github.com/diyanme/employee-platform-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: employee-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
