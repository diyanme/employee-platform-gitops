apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: employee-staging
type: Opaque
stringData:
  MYSQL_DATABASE: employee_platform
  MYSQL_USER: employee_user
  MYSQL_PASSWORD: employee_password
  MYSQL_ROOT_PASSWORD: root_password

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: employee-staging
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: employee-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: mysql-secret
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: employee-staging
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
